name: Sync content

# Pulls the external feeds once a day and commits whatever changed:
#
#   builds  <- shinigamae.blogspot.com  (scripts/blog-sync.mjs)
#   books   <- goodreads.com RSS        (scripts/goodreads-sync.mjs)
#   games   <- PlayStation Network      (scripts/psn-sync.mjs)
#   albums  <- Flickr API                (scripts/flickr-sync.mjs)
#   music   <- Spotify Web API           (scripts/spotify-sync.mjs)
#
# Both live in one workflow on purpose. As two workflows on the same schedule
# they would each check out main, each commit, and the second push would fail
# on a non-fast-forward — and on the runs where it did not, they would deploy
# the site twice for one day's changes.
#
# Nothing here is destructive by design: each sync refuses to run if its feed
# comes back empty, and the commit only happens after `astro check` validates
# every entry against its schema.

on:
  schedule:
    # 10:47 UTC — aiming at 18:00 in Ho Chi Minh City, so a day's listening,
    # reading and playing is counted before the run rather than after it.
    #
    # The odd minute is deliberate. GitHub queues scheduled runs on a shared
    # pool and the top of the hour is the most contended slot on it: at
    # `0 3 * * *` this workflow never once started before 07:37 UTC — four and
    # a half hours late, every day. A schedule here is a "no earlier than",
    # never a promise, and `workflow_dispatch` is what you use when you want
    # it now.
    - cron: '47 10 * * *'
  # Lets you pull a post in immediately instead of waiting for the schedule.
  workflow_dispatch:

permissions:
  contents: write

# One sync at a time. Two runs committing the same generated files would
# conflict, and the later push would fail on a stale ref.
concurrency:
  group: content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sync build archive from Blogspot
        run: npm run blog:sync

      # Not `continue-on-error`: a shelf turning private should be loud. But
      # it must not discard a successful builds sync, so it runs second and
      # the commit step below is reached either way.
      - name: Sync reading log from Goodreads
        id: books
        continue-on-error: true
        run: npm run books:sync

      # Same treatment: the npsso credential expires roughly every two months,
      # and that must not take the other two sources down with it.
      - name: Sync gaming log from PSN
        id: games
        continue-on-error: true
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
        run: npm run games:sync

      # No credential: Flickr restricted API keys to Pro accounts, so this
      # reads public pages and oEmbed instead. Isolated like the others.
      - name: Sync journeys from Flickr
        id: albums
        continue-on-error: true
        run: npm run albums:sync

      # Needs a user grant, not just an app credential: "most played" is not
      # public data. The refresh token does not expire, but it is revoked by a
      # password change or by removing the app's access — hence its own step.
      - name: Sync on rotation from Spotify
        id: music
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        # The skip-if-unset guard that used to live here is gone (2026-09-14):
        # the three secrets are set, so a missing token now means the grant was
        # revoked, and that should go red rather than pass quietly.
        run: npm run music:sync

      # Guards the commit: an entry that defeats a parser should fail here
      # rather than land broken on main.
      - name: Check
        run: npm run check

      - name: Commit
        id: commit
        run: |
          # Staged first: a new entry arrives as an untracked file, which a
          # plain `git diff` would not report.
          git add src/content
          if git diff --cached --quiet -- src/content; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change — the feeds match the site."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync content from external feeds'

          # A sync takes two or three minutes, and anyone pushing inside that
          # window leaves this commit behind the remote: the push is rejected
          # non-fast-forward and the run throws away content it already
          # fetched. (Happened 2026-09-14, run 34804317454.) `concurrency`
          # cannot help — it serialises this workflow against itself, not
          # against a person.
          #
          # Rebase and retry. This commit only ever touches src/content, and
          # a human push that also touched it would be editing generated
          # files, so a conflict here means something is wrong that a retry
          # should not paper over — hence --rebase, not a merge, and a hard
          # stop if it does not apply cleanly.
          for attempt in 1 2 3; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push $attempt rejected — rebasing onto the new $GITHUB_REF_NAME."
            git pull --rebase --quiet origin "$GITHUB_REF_NAME" || {
              git rebase --abort 2>/dev/null || true
              echo "::error::Sync commit conflicts with a push to $GITHUB_REF_NAME. Someone hand-edited a generated file under src/content."
              exit 1
            }
          done

          echo "::error::Could not push the sync commit after 3 attempts - $GITHUB_REF_NAME is being written to to faster than the sync can rebase."
          exit 1

      # Surfaces a failed sync after the other sources are safely committed,
      # so the run is still marked red and you go and look.
      # `always()` because a step that only runs when everything before it
      # succeeded cannot report failures. Without it a failed Commit skips
      # this one, and the run goes red saying nothing about which source
      # broke — which is precisely what happened on 2026-09-14.
      - name: Report source failures
        if: >-
          always() && (steps.books.outcome == 'failure' || steps.games.outcome == 'failure'
          || steps.albums.outcome == 'failure' || steps.music.outcome == 'failure')
        run: |
          if [ "${{ steps.books.outcome }}" = "failure" ]; then
            echo "::error::Goodreads sync failed - is the shelf still public?"
          fi
          if [ "${{ steps.games.outcome }}" = "failure" ]; then
            echo "::error::PSN sync failed - the npsso token expires about every two months. Refresh the PSN_NPSSO secret."
          fi
          if [ "${{ steps.albums.outcome }}" = "failure" ]; then
            echo "::error::Flickr sync failed - most likely a markup change or a bot challenge. See the header of scripts/flickr-sync.mjs."
          fi
          if [ "${{ steps.music.outcome }}" = "failure" ]; then
            echo "::error::Spotify sync failed - if it says invalid_grant the token was revoked, and 'npm run music:auth' issues a new one."
          fi
          echo "Whatever did sync has still been committed and deployed."
          exit 1

  # Publishing is deploy.yml's job, not a second copy of it here.
  deploy:
    needs: sync
    # `always()` so that a failed Goodreads sync still publishes whatever the
    # builds sync committed. Without it a private shelf would quietly hold
    # back every new blog post until someone noticed the red run.
    if: always() && needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      # Without this the deploy checks out the SHA that started this run —
      # the state before the sync commit above.
      ref: ${{ needs.sync.outputs.sha }}
