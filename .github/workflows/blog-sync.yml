name: Sync build archive

# Pulls the Blogspot feed once a day and commits any change to
# src/content/builds/. Posting on the blog is the whole publishing workflow;
# this is what makes the site notice.
#
# Nothing here is destructive by design: blog-sync.mjs refuses to run if the
# feed comes back empty, and the commit only happens after `astro check`
# validates every entry against its schema.

on:
  schedule:
    # 03:00 UTC — 10:00 in Ho Chi Minh City, so a morning post is live by the
    # next working day without waiting on a manual run.
    - cron: '0 3 * * *'
  # Lets you pull a post in immediately instead of waiting for the schedule.
  workflow_dispatch:

permissions:
  contents: write

# One sync at a time. Two runs committing the same generated files would
# conflict, and the later push would fail on a stale ref.
concurrency:
  group: blog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sync from Blogspot
        run: npm run blog:sync

      # Guards the commit: a post whose title or body defeats the parser
      # should fail here rather than land as a broken entry on main.
      - name: Check
        run: npm run check

      - name: Commit
        id: commit
        run: |
          # Staged first: a new post arrives as an untracked file, which a
          # plain `git diff` would not report.
          git add src/content/builds
          if git diff --cached --quiet -- src/content/builds; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change — the feed matches the archive."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync build archive from Blogspot'
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Publishing is deploy.yml's job, not a second copy of it here.
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      # Without this the deploy checks out the SHA that started this run —
      # the state before the sync commit above.
      ref: ${{ needs.sync.outputs.sha }}
