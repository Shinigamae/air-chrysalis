name: Deploy to GitHub Pages

# Builds the static site and uploads it straight to Pages as an artifact.
# There is no gh-pages branch and no docs/ folder — dist/ stays gitignored.
# Set Settings → Pages → Source to "GitHub Actions" once, then forget it.

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing.
  workflow_dispatch:
  # Called by blog-sync.yml. A push made with GITHUB_TOKEN deliberately does
  # not trigger other workflows, so the daily sync would otherwise commit new
  # builds and never publish them.
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit to build. A called workflow checks out the SHA that started
          the run, which for blog-sync is the state *before* its own sync
          commit — without this the deploy publishes one run behind.
        type: string
        required: false
        default: ''

# Pages needs these; the default token has neither.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a push that lands
# mid-deploy still ships instead of being silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Empty means "the ref that triggered this run", which is what the
          # push and workflow_dispatch triggers want.
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Type and template diagnostics. The build alone would not catch a
      # content entry that violates its schema in a way Astro tolerates.
      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
